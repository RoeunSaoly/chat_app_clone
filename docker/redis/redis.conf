#################################
# NETWORK
#################################

# Listen on all interfaces (required for Docker containers)
bind 0.0.0.0

# Redis default port
port 6379

# Disable protected mode for container networking
protected-mode no


#################################
# GENERAL
#################################

# Run Redis in foreground (Docker requirement)
daemonize no

# Log level
loglevel notice

# Log file (empty = stdout)
logfile ""


#################################
# MEMORY MANAGEMENT
#################################

# Maximum memory Redis can use
maxmemory 256mb

# Eviction policy when memory limit reached
maxmemory-policy allkeys-lru


#################################
# PERSISTENCE
#################################

# Save snapshot if at least 1 key changed in 900 sec
save 900 1

# Save snapshot if at least 10 keys changed in 300 sec
save 300 10

# Save snapshot if at least 10000 keys changed in 60 sec
save 60 10000

# Enable append-only file
appendonly yes

appendfilename "appendonly.aof"


#################################
# SECURITY
#################################

# Optional password protection
# requirepass strongpassword


#################################
# PERFORMANCE
#################################

# TCP backlog
tcp-backlog 511

# Timeout
timeout 0

# Keepalive
tcp-keepalive 300


#################################
# PUB/SUB
#################################

# Useful for Socket.IO Redis adapter
notify-keyspace-events Ex


#################################
# CLIENTS
#################################

# Max clients
maxclients 10000